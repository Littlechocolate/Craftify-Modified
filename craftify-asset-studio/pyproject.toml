[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "craftify-asset-studio"
version = "1.0.0"
description = "Minecraft Model & Texture Extractor, 3D Inventory Renderer, and Creative Categorizer for Craftify"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "customtkinter>=6.0.0",
    "darkdetect>=0.8.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
]

[project.scripts]
craftify-studio = "craftify_asset_studio.gui.app:main"
craftify-render = "craftify_asset_studio.cli:main"
