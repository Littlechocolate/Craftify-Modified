name: Build & Test Craftify iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Configure Xcode Project
        run: |
          python3 scripts/setup_xcode_project.py

      - name: Build Craftify for iOS Device (arm64)
        run: |
          xcodebuild clean build \
            -scheme Craftify \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build-output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Test Craftify on iOS 18 Simulator
        run: |
          echo "Available iOS Simulator runtimes and devices:"
          xcrun simctl list devices available

          # Build Craftify for iOS Simulator
          echo "Building Craftify for iOS Simulator..."
          xcodebuild clean build \
            -scheme Craftify \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -configuration Release \
            -derivedDataPath ./build-sim-output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          SIM_APP="./build-sim-output/Build/Products/Release-iphonesimulator/Craftify.app"
          if [ ! -d "$SIM_APP" ]; then
            echo "Error: Simulator app not found at $SIM_APP"
            exit 1
          fi

          echo "Found simulator app at $SIM_APP"
          echo "Inspecting simulator Info.plist:"
          plutil -p "$SIM_APP/Info.plist"
          DEVICE_UDID=$(xcrun simctl list devices "iOS 18.2" 2>/dev/null | grep "iPhone 16 (" | head -1 | grep -o -E '[0-9A-F-]{36}')
          if [ -z "$DEVICE_UDID" ]; then
            DEVICE_UDID=$(xcrun simctl list devices "iOS 18.1" 2>/dev/null | grep "iPhone 16 (" | head -1 | grep -o -E '[0-9A-F-]{36}')
          fi
          if [ -z "$DEVICE_UDID" ]; then
            DEVICE_UDID=$(xcrun simctl list devices available | grep "iPhone 16 (" | head -1 | grep -o -E '[0-9A-F-]{36}')
          fi
          echo "Using iOS 18 Simulator Device UDID: $DEVICE_UDID"

          # Ad-hoc sign for simulator execution (required by macOS CoreSimulator installd)
          echo "Applying ad-hoc signature for simulator execution..."
          codesign --force --deep --sign - "$SIM_APP"

          # Boot simulator
          echo "Booting Simulator..."
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b

          # Install the app
          echo "Installing Craftify onto iOS 18 Simulator..."
          xcrun simctl install "$DEVICE_UDID" "$SIM_APP"

          # Launch the app
          echo "Launching Craftify on Simulator..."
          LAUNCH_OUT=$(xcrun simctl launch "$DEVICE_UDID" be.ghentphotography.www.Craftify)
          echo "Launch result: $LAUNCH_OUT"

          # Allow SwiftUI views and local recipe database to initialize
          sleep 6

          # Verify the app process is alive
          PID=$(echo "$LAUNCH_OUT" | grep -o -E '[0-9]+' | head -1)
          if [ -n "$PID" ]; then
            if kill -0 "$PID" 2>/dev/null; then
              echo "✅ SUCCESS: Craftify (PID $PID) is running stably on iOS Simulator!"
            else
              echo "❌ ERROR: Craftify exited unexpectedly after launch!"
              exit 1
            fi
          fi

          # Capture a screenshot from the simulator to visually confirm the UI
          mkdir -p test-artifacts
          xcrun simctl io "$DEVICE_UDID" screenshot test-artifacts/simulator_screenshot.png
          echo "Captured simulator screenshot to test-artifacts/simulator_screenshot.png"

          # Clean up simulator
          xcrun simctl terminate "$DEVICE_UDID" be.ghentphotography.www.Craftify || true
          xcrun simctl shutdown "$DEVICE_UDID" || true

      - name: Package Standard Unsigned IPA & ZIP
        run: |
          APP_PATH="./build-output/Build/Products/Release-iphoneos/Craftify.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: Craftify.app not found at $APP_PATH"
            find ./build-output -name "Craftify.app"
            exit 1
          fi

          echo "Found compiled app at: $APP_PATH"
          file "$APP_PATH/Craftify"

          echo "Preparing clean Payload directory..."
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # Remove any residual signature folders to ensure a 100% pure unsigned bundle
          rm -rf Payload/Craftify.app/_CodeSignature

          # Guard: a top-level "Resources" dir makes CFBundle use the legacy layout
          # (Info.plist/executable not found) -> must never be present in an iOS .app
          if [ -e Payload/Craftify.app/Resources ]; then
            echo "❌ Reserved 'Resources' directory found at bundle root"; exit 1
          fi
          echo "Bundled recipe packs:"
          ls -l Payload/Craftify.app/*.recipe

          # Clean macOS filesystem extended attributes
          xattr -cr Payload/Craftify.app || true

          # Validate Info.plist
          plutil -lint Payload/Craftify.app/Info.plist
          echo "Device Info.plist contents:"
          plutil -p Payload/Craftify.app/Info.plist

          echo "Payload contents:"
          ls -la Payload/Craftify.app/

          # Package as standard unsigned .ipa (-y preserves symbolic links, -qr quiet recursive)
          echo "Creating Craftify.ipa..."
          zip -qry Craftify.ipa Payload

          # Create .zip copy for convenient transmission
          echo "Creating Craftify.zip..."
          cp Craftify.ipa Craftify.zip

          # Verify package contents
          echo "IPA contents summary:"
          unzip -l Craftify.ipa | head -n 35

          echo "File sizes:"
          ls -lh Craftify.ipa Craftify.zip

          # Generate checksums
          shasum -a 256 Craftify.ipa Craftify.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Craftify-Standard-Unsigned-IPA
          path: |
            Craftify.ipa
            Craftify.zip
            SHA256SUMS.txt
            test-artifacts/simulator_screenshot.png
          retention-days: 14

      - name: Generate Release Notes
        if: github.ref == 'refs/heads/main'
        run: |
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          COMMIT_SUBJECT=$(git log -1 --pretty=format:"%s")
          {
            echo "### Craftify iOS 标准未签名版 (Build ${{ github.run_number }} · \`${COMMIT_SHORT}\`)"
            echo ""
            echo "#### 本次修改内容"
            if [ -s RELEASE_CHANGELOG.md ]; then
              cat RELEASE_CHANGELOG.md
            else
              echo "- ${COMMIT_SUBJECT}"
            fi
            echo ""
            echo "#### 最近提交记录"
            git log -n 3 --pretty=format:"- \`%h\` %s"
            echo ""
            echo ""
            echo "#### 版本说明"
            echo "- **标准规范构建**：产出 100% 标准未加密未签名 iOS IPA。"
            echo "- **已通过 iOS 18 模拟器实测**：工作流构建过程中自动在 iOS 18 模拟器完成安装与启动测试，验证应用无启动崩溃、无依赖缺失，并附带模拟器启动截图。"
            echo "- **离线配方与版本独立图标包**：完全基于本地存储，预置 Minecraft 1.21.1、26w14a 与 26.3，按版本独立隔离存储与识别。"
            echo ""
            echo "#### 安装说明"
            echo "- 本包为标准未签名 IPA，可直接使用任意签名工具（LiveContainer、SideStore、AltStore、TrollStore、ESign、Feather 等）进行自签并在 iOS 17 / 18 上正常安装运行。"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.1.0-standard-build-${{ github.run_number }}"
          name: "Craftify v1.1.0 Standard Unsigned (Build ${{ github.run_number }})"
          body_path: RELEASE_NOTES.md
          files: |
            Craftify.ipa
            Craftify.zip
            SHA256SUMS.txt
            test-artifacts/simulator_screenshot.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
