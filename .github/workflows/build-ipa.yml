name: Build Craftify iOS IPA & ZIP for LiveContainer

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build iOS IPA & ZIP
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Configure Xcode Project
        run: |
          python3 scripts/setup_xcode_project.py

      - name: Build Craftify for iOS (arm64)
        run: |
          xcodebuild clean build \
            -scheme Craftify \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build-output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unencrypted IPA & ZIP for LiveContainer
        run: |
          APP_PATH="./build-output/Build/Products/Release-iphoneos/Craftify.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: Craftify.app not found at $APP_PATH"
            find ./build-output -name "Craftify.app"
            exit 1
          fi

          echo "Found compiled app at: $APP_PATH"
          echo "Inspecting Mach-O binary info:"
          file "$APP_PATH/Craftify"

          echo "Preparing Payload directory..."
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # Ensure binary is executable
          chmod 755 Payload/Craftify.app/Craftify

          # Ensure Info.plist exists and contains CFBundleExecutable
          if [ ! -f "Payload/Craftify.app/Info.plist" ]; then
            echo "Error: Info.plist not found in Payload/Craftify.app!"
            exit 1
          fi

          # Reset MinimumOSVersion to 17.0
          /usr/libexec/PlistBuddy -c "Delete :MinimumOSVersion" Payload/Craftify.app/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 17.0" Payload/Craftify.app/Info.plist

          # Remove any residual iCloud keys
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.icloud-container-identifiers" Payload/Craftify.app/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.icloud-services" Payload/Craftify.app/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :NSUbiquitousContainers" Payload/Craftify.app/Info.plist 2>/dev/null || true

          # Ensure CFBundleExecutable is exactly Craftify
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Craftify" Payload/Craftify.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string Craftify" Payload/Craftify.app/Info.plist 2>/dev/null || true

          # Ensure CFBundleIdentifier is be.ghentphotography.www.Craftify
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier be.ghentphotography.www.Craftify" Payload/Craftify.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string be.ghentphotography.www.Craftify" Payload/Craftify.app/Info.plist 2>/dev/null || true

          # Convert Info.plist to XML1 so LiveContainer / ZSign custom parser parses reliably
          plutil -convert xml1 Payload/Craftify.app/Info.plist
          plutil -lint Payload/Craftify.app/Info.plist

          echo "Verified Info.plist:"
          /usr/libexec/PlistBuddy -c "Print CFBundleExecutable" Payload/Craftify.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" Payload/Craftify.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print MinimumOSVersion" Payload/Craftify.app/Info.plist

          # CRITICAL: Clean any LCAppInfo.plist, LiveContainer.tmp, or duplicate executable binaries!
          rm -f Payload/Craftify.app/LCAppInfo.plist
          rm -f Payload/Craftify.app/LiveContainer.tmp
          rm -f Payload/Craftify.app/be.ghentphotography.www.Craftify

          # Clean extended attributes
          xattr -cr Payload/Craftify.app || true

          # Clean previous signature and sign with exact bundle identifier
          rm -rf Payload/Craftify.app/_CodeSignature
          codesign --force --sign - --identifier "be.ghentphotography.www.Craftify" Payload/Craftify.app/Craftify
          codesign --force --sign - --identifier "be.ghentphotography.www.Craftify" Payload/Craftify.app
          codesign -dvvv Payload/Craftify.app || true

          # Verify package layout before archiving
          echo "Payload contents:"
          ls -la Payload/Craftify.app/

          # Package as .ipa (-y to store symbolic links properly, -qr)
          echo "Creating Craftify.ipa..."
          zip -qry Craftify.ipa Payload

          # Create .zip copy as requested by user for easier transfer
          echo "Creating Craftify.zip for transmission..."
          cp Craftify.ipa Craftify.zip

          # Verify package contents
          echo "IPA archive contents (top-level):"
          unzip -l Craftify.ipa | head -n 35

          echo "File sizes:"
          ls -lh Craftify.ipa Craftify.zip

          # Generate checksums
          shasum -a 256 Craftify.ipa Craftify.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Craftify-LiveContainer-Release
          path: |
            Craftify.ipa
            Craftify.zip
            SHA256SUMS.txt
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.1.0-livecontainer-${{ github.run_number }}"
          name: "Craftify v1.1.0 for LiveContainer (Build ${{ github.run_number }})"
          body: |
            ### Craftify iOS 离线配方版 (LiveContainer iOS 18.5 兼容版 Build ${{ github.run_number }})

            **版本特性**：
            - 完全移除 CloudKit / CoreData 冲突依赖，支持本地 `.recipe` 配方库
            - 预置 Minecraft 1.21.1 (1,290 配方) 与 26w14a (1,513 配方)
            - 遵循 Minecraft Wiki 官方游戏内分类 (Building Blocks, Equipment, Redstone, Food & Cooking, Misc)
            - 设置页内置多版本切换与配方导入冲突解决器 (替换 / 同时保留 / 取消)
            - 最低支持系统已精确匹配至 iOS 17.0，最大化提升 LiveContainer dyld hook 兼容性
            - 彻底移除 CloudKit，消除权限验证失败导致的动态库加载阻塞
            - 清理所有冲突临时文件与多余别名，精确绑定 Bundle Identifier 与可执行文件签名，彻底解决 `executable path not found` 问题

            **iOS 18.5 LiveContainer 安装关键步骤**：
            1. **必须先完全删除** LiveContainer 中此前安装的 Craftify 图标及残留应用数据（长按删除），防止之前旧版损坏的 `Info.plist` 残留缓存干扰。
            2. 导入本版本 `Craftify.ipa` 或 `Craftify.zip`。
            3. 长按 Craftify 图标进入 **App Settings (应用设置)**：
               - 若你使用 JIT 模式或 TrollStore：开启 **Don't sign app (无需签名)**。
               - 若你使用 JIT-Less (P12证书) 模式：点击 **Force Sign (强制重新签名)** 确保证书成功注入。
               - 若仍有兼容性提示，可尝试切换 **Spoof SDK Version (伪装 SDK 版本)**。
            4. 点击启动应用即可流畅运行！
          files: |
            Craftify.ipa
            Craftify.zip
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

